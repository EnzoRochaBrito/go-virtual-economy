services:
  postgres:
    image: postgres:17
    container_name: virtualeconomy
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtualeconomy
      POSTGRES_USER: superadmin
      POSTGRES_PASSWORD: nooneknows
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superadmin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: